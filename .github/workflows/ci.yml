# Managed file. Edit it in sirloinbh/project-standards templates/service/.github/workflows/
# Calls the central shared CI (reusable-service-ci) pinned to the central commit that was synced.
name: ci

on: [push, pull_request]

permissions:
  contents: read
  # write is the most the image-push job of the reusable workflow may use; every other job gets read (ADR-0023, #757).
  packages: write

# A new push to a pull request branch cancels that branch's older run. A run on main is never cancelled:
# autodeploy treats a cancelled run of a commit as a failure, so main runs get a group of their own (#873).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: sirloinbh/project-standards/.github/workflows/reusable-service-ci.yml@7a57520840d108b7f056e1904dc6a731c12bf9da
    with:
      node-version: '24.21.0'
      npm-version: '11.19.0'
      push-images: true
      image-prefix: 'ghcr.io/sirloinbh/shared-auth'
