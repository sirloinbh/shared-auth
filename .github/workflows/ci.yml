# Managed file. Edit it in sirloinbh/project-standards templates/service/.github/workflows/
# Calls the central shared CI (reusable-service-ci) pinned to the central commit that was synced.
name: ci

on: [push, pull_request]

permissions:
  contents: read

jobs:
  ci:
    uses: sirloinbh/project-standards/.github/workflows/reusable-service-ci.yml@9a7a6d048ac51a3d80516751b2d04f9d8cb487c1
    with:
      node-version: '24.21.0'
      npm-version: '11.19.0'
