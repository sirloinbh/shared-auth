# Shared sign-in service (ADR-0015 in sirloinbh/project-standards). Registry: shared-auth, slot 10.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: auth
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [db-data:/var/lib/postgresql/data]
    ports: ['127.0.0.1:${DB_PORT:-15410}:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U auth -d auth']
      interval: 5s
      retries: 10
  api:
    build: { context: ./backend, secrets: [npm_token] }
    image: shared-auth-backend:${IMAGE_TAG:-local}
    restart: unless-stopped
    # A small init as PID 1 forwards SIGTERM to node, which closes the server and the pool (src/shutdown.ts),
    # so `docker compose stop` and a deploy take about a second instead of the 10 s stop timeout.
    init: true
    depends_on:
      db: { condition: service_healthy }
    # Same check as the app scaffold (project-standards scaffold/app/compose.yaml): the image has no curl, so
    # node's fetch asks /api/health (200 when the database answers). `docker compose up -d --wait` waits for it.
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3110/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s
    environment:
      PORT: 3110
      DATABASE_URL: postgres://auth:${POSTGRES_PASSWORD}@db:5432/auth
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:8110}
      ROOT_DOMAIN: ${ROOT_DOMAIN:-daysofme.com}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS:?set ALLOWED_EMAILS}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:?set GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:?set GITHUB_CLIENT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET}
    # The server proxy forwards https://auth.<root domain> here. Locally: http://localhost:8110.
    ports: ['${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8110}:3110']
    networks:
      default: {}
      # App APIs check sessions at http://shared-auth-api:3110 on this network (@sirloinbh/auth-client).
      shared-auth: { aliases: [shared-auth-api] }
networks:
  shared-auth:
    name: shared-auth
# The backend Dockerfile reads the GitHub Packages token as a BuildKit secret, so it never lands in an image layer.
secrets:
  npm_token:
    environment: NODE_AUTH_TOKEN
volumes:
  db-data:
